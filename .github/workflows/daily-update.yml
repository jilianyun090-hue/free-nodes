name: 每日抓取免费节点

on:
  schedule:
    # UTC 16:15 = 北京时间次日 00:15
    - cron: '15 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 抓取并校验订阅
        run: node scripts/update.mjs
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md subscriptions/v.txt subscriptions/c.yaml
          if git diff --cached --quiet; then
            echo "内容没有变化"
          else
            git commit -m "更新免费节点订阅"
            git push
          fi
